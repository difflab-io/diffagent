[package]
name = "diffagent-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Command-line client and desktop launcher for Diffagent."
repository = "https://github.com/difflab-io/diffagent"
publish = false
license = "Apache-2.0"

[[bin]]
name = "diffagent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
