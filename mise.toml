# Workspace-level mise configuration generated by premise.
# Project lifecycle tasks are addressed with `mise run '//...:<task>'`.

monorepo_root = true

[env]
# Keep diagnostics stable and isolate local development from ~/.diffagent.
LC_ALL = "{% if os() == 'macos' %}en_US.UTF-8{% else %}C.UTF-8{% endif %}"
DIFFAGENT_HOME = "{{config_root}}/.tmp/diffagent-home"

[monorepo]
config_roots = ["apps/*", "libs/*", "e2e/cli", "e2e/desktop"]

[tools]
rust = { version = "1.94.0", components = "rustfmt,clippy,rust-analyzer" }
bun = "1.4.2"
node = "24"
"cargo:cargo-zigbuild" = "0.23.4"
zig = "0.16.0"

[tasks.install]
run = ["cargo fetch", "bun install"]

[tasks.build]
run = [
  "cargo build --workspace",
  "bun run --filter diffagent-ui build",
  "bun run --filter diffagent-web build",
]

[tasks.test]
depends = ["e2e:typecheck"]
run = [
  "cargo test --workspace",
  "mise run //apps/diffagent-desktop:test",
  "bun run --filter diffagent-ui test",
  "bun run --filter diffagent-web test",
]

[tasks.lint]
depends = ["e2e:lint", "//e2e/desktop:lint"]
run = [
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "mise run //apps/diffagent-desktop:lint",
  "mise run //libs/diffagent-ui:lint",
  "mise run //apps/diffagent-web:lint",
]

[tasks.format]
depends = ["e2e:format", "//e2e/desktop:format"]
run = [
  "cargo fmt --all",
  "cargo fmt --manifest-path apps/diffagent-desktop/Cargo.toml -p diffagent-desktop",
  "mise run //libs/diffagent-ui:format",
  "mise run //apps/diffagent-web:format",
]

[tasks."format:check"]
depends = ["e2e:format:check", "//e2e/desktop:format:check"]
run = [
  "cargo fmt --all --check",
  "cargo fmt --manifest-path apps/diffagent-desktop/Cargo.toml -p diffagent-desktop --check",
  "mise run //libs/diffagent-ui:format:check",
  "mise run //apps/diffagent-web:format:check",
]

[tasks."run:cli"]
description = "Run the Diffagent CLI"
alias = "dev:cli"
run = "cargo run -p diffagent-cli --bin diffagent --"

[tasks."dev:web"]
description = "Run the Diffagent web shell in Vite dev mode"
run = "mise run //apps/diffagent-web:dev"

[tasks."dev:desktop"]
description = "Run the Diffagent desktop application in development mode"
run = "mise run //apps/diffagent-desktop:dev"

[tasks."e2e:cli"]
description = "Run CLI E2E tests"
usage = 'flag "--extended" help="Include extended tests"'
run = 'DIFFAGENT_E2E_EXTENDED="${usage_extended:-false}" mise run //e2e/cli:test'

[tasks."e2e:cli:run"]
description = "Run CLI E2E journeys against existing binaries without rebuilding"
run = "bun x vitest run --config e2e/cli/vitest.config.ts"

[tasks."e2e:desktop"]
description = "Run desktop E2E tests"
run = "mise run //e2e/desktop:test"

[tasks.e2e]
description = "Run CLI and desktop E2E suites in parallel"
usage = 'flag "--extended" help="Include extended tests"'
run = '''
export DIFFAGENT_E2E_EXTENDED="${usage_extended:-false}"
mise run --continue-on-error //e2e/cli:test ::: //e2e/desktop:test
'''

[tasks."e2e:smoke"]
description = "Run representative smoke E2E flows across CLI and desktop"
run = "mise run --continue-on-error //e2e/cli:smoke ::: //e2e/desktop:smoke"

[tasks."e2e:list"]
description = "List local BDD E2E journeys without running them"
depends = ["//e2e/cli:list", "//e2e/desktop:list"]

[tasks."e2e:typecheck"]
description = "Type-check shared and CLI E2E TypeScript sources"
run = "bun x tsc -p e2e/tsconfig.json"

[tasks."e2e:lint"]
description = "Lint shared and CLI E2E TypeScript sources"
run = "bun x eslint e2e/common e2e/cli"

[tasks."e2e:format"]
description = "Format E2E TypeScript and Markdown files"
run = "bun x prettier --write 'e2e/{common,cli}/**/*.ts' e2e/tsconfig.json e2e/README.md docs AGENTS.md README.md"

[tasks."e2e:format:check"]
description = "Check formatting of E2E TypeScript and Markdown files"
run = "bun x prettier --check 'e2e/{common,cli}/**/*.ts' e2e/tsconfig.json e2e/README.md docs AGENTS.md README.md"
