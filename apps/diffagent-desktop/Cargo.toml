[package]
name = "diffagent-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Diffagent desktop application shell and Tauri IPC host."
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive", "function"] }
specta-typescript = "0.0.13"
tauri = { version = "=2.11.6", features = [] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[dev-dependencies]
tauri = { version = "=2.11.6", features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
e2e-bridge = ["tauri/test"]
