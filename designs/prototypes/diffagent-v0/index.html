<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diffagent v0 — declarative bot console</title>
    <!-- Match Difflab and LGTM pinned, browser-only prototype dependencies. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/preline@5.0.0/dist/preline.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: Inter, ui-sans-serif, system-ui, sans-serif;
      }
    </style>
    <style>
      :root {
        font:
          11px Inter,
          ui-sans-serif,
          system-ui,
          sans-serif;
        color: #1e293b;
        background: #f1f5f9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f1f5f9;
        color: #1e293b;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        outline-offset: 2px;
      }
      button {
        cursor: pointer;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
        background: #fff;
        color: #334155;
        padding: 5px 9px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      button:hover {
        background: #f1f5f9;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #475569;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 16px;
        font-weight: 650;
      }
      h2 {
        font-size: 12px;
        font-weight: 600;
      }
      h3 {
        font-size: 11px;
        font-weight: 600;
      }
      p {
        line-height: 1.5;
      }
      input:not([type='radio']):not([type='checkbox']),
      select,
      textarea {
        border: 1px solid #cbd5e1;
        border-radius: 5px;
        padding: 6px 8px;
        background: #fff;
        color: #1e293b;
      }
      textarea {
        width: 100%;
        resize: vertical;
        line-height: 1.5;
      }
      input[type='radio'],
      input[type='checkbox'] {
        accent-color: #334155;
      }
      label {
        cursor: pointer;
      }
      code,
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .primary {
        background: #1e293b;
        color: #fff;
        border-color: #1e293b;
      }
      .primary:hover {
        background: #0f172a;
      }
      .quiet {
        border-color: transparent;
        background: transparent;
      }
      .quiet:hover {
        background: #e2e8f0;
      }
      .danger {
        color: #be123c;
        border-color: #fecdd3;
        background: #fff1f2;
      }
      .danger:hover {
        background: #ffe4e6;
      }
      .muted {
        color: #64748b;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        font-weight: 500;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        color: #475569;
        border-radius: 4px;
        padding: 1px 6px;
        white-space: nowrap;
      }
      .badge.green {
        background: #ecfdf5;
        border-color: #a7f3d0;
        color: #047857;
      }
      .badge.amber {
        background: #fffbeb;
        border-color: #fde68a;
        color: #b45309;
      }
      .badge.red {
        background: #fff1f2;
        border-color: #fecdd3;
        color: #be123c;
      }
      .badge.blue {
        background: #f0f9ff;
        border-color: #bae6fd;
        color: #0369a1;
      }
      .badge.violet {
        background: #f5f3ff;
        border-color: #ddd6fe;
        color: #6d28d9;
      }
      /* Outer Shell: Topbar + Body (Left Rail + Main + Right Settings Sidebar) */
      .shell {
        height: 100dvh;
        min-height: 540px;
        display: flex;
        flex-direction: column;
        background: #f8fafc;
        overflow: hidden;
      }
      .topbar {
        height: 48px;
        flex: none;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border-bottom: 1px solid #e2e8f0;
        background: #fff;
      }
      .top-left {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }
      .brand-lockup {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        flex: none;
      }
      .brand-mark {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: #0f172a;
        color: #fff;
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: -0.5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .brand-text {
        font-size: 13.5px;
        font-weight: 750;
        letter-spacing: -0.5px;
        color: #0f172a;
      }
      .top-divider {
        width: 1px;
        height: 18px;
        background: #e2e8f0;
        flex: none;
      }
      .top-bot-info {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .top-title {
        font-size: 12px;
        font-weight: 650;
        color: #0f172a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .top-center {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .top-tabs {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        background: #f1f5f9;
        padding: 3px;
        border-radius: 6px;
        border: 1px solid #e2e8f0;
      }
      .tab-btn {
        border: 1px solid transparent;
        background: transparent;
        padding: 4px 12px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
        color: #475569;
      }
      .tab-btn:hover {
        color: #0f172a;
        background: rgba(255, 255, 255, 0.6);
      }
      .tab-btn.active {
        background: #fff;
        color: #0f172a;
        border-color: #cbd5e1;
        font-weight: 600;
        box-shadow: 0 1px 1px rgba(15, 23, 42, 0.04);
      }
      .top-right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
      }
      .body-row {
        flex: 1;
        min-height: 0;
        display: flex;
        overflow: hidden;
      }
      /* Permanently Collapsed Avatar Rail (Full Top-Down, No Collapse, No Search) */
      .rail {
        width: 56px;
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #f8fafc;
        border-right: 1px solid #e2e8f0;
        padding: 10px 0 10px;
        gap: 8px;
        min-height: 0;
      }
      .rail-bots {
        flex: 1;
        min-height: 0;
        width: 100%;
        overflow: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 2px 0;
      }
      .rail-slot {
        position: relative;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 1.5px solid transparent;
        border-radius: 11px;
        background: transparent;
        justify-content: center;
        flex: none;
      }
      .rail-slot:hover {
        background: #e2e8f0;
      }
      .rail-slot.active {
        background: #fff;
        border-color: #94a3b8;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      }
      .rail-slot.active::before {
        content: '';
        position: absolute;
        left: -8px;
        top: 9px;
        bottom: 9px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: #0f172a;
      }
      .rail-slot.paused {
        opacity: 0.62;
      }
      .rail-add {
        width: 34px;
        height: 34px;
        padding: 0;
        border: 1.5px dashed #cbd5e1;
        border-radius: 10px;
        background: #fff;
        color: #475569;
        font-size: 16px;
        font-weight: 500;
        justify-content: center;
        flex: none;
      }
      .rail-add:hover {
        border-color: #475569;
        color: #0f172a;
        background: #f1f5f9;
      }
      .rail-dot {
        position: absolute;
        right: 2px;
        bottom: 2px;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        border: 1.5px solid #f8fafc;
      }
      .rail-dot.online {
        background: #10b981;
      }
      .rail-dot.idle {
        background: #f59e0b;
      }
      .rail-dot.paused {
        background: #94a3b8;
      }
      .rail-footer {
        position: relative;
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding-top: 10px;
        border-top: 1px solid #e2e8f0;
        width: 100%;
      }
      .rail-icon {
        width: 34px;
        height: 34px;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        color: #475569;
        justify-content: center;
      }
      .rail-icon:hover {
        background: #e2e8f0;
        color: #0f172a;
      }
      .rail-icon.active {
        background: #fff;
        border-color: #cbd5e1;
        color: #0f172a;
      }
      .user-avatar-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 999px;
        border: 1.5px solid #cbd5e1;
        background: #1e293b;
        color: #fff;
        font-size: 10.5px;
        font-weight: 700;
        justify-content: center;
      }
      .user-avatar-btn:hover {
        background: #0f172a;
        border-color: #64748b;
      }
      .account-menu {
        position: absolute;
        left: 62px;
        bottom: 6px;
        z-index: 35;
        width: 204px;
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.14);
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .account-head {
        padding: 6px 8px 8px;
        border-bottom: 1px solid #f1f5f9;
        margin-bottom: 3px;
      }
      .menu-item {
        width: 100%;
        border: 0;
        background: transparent;
        border-radius: 5px;
        padding: 6px 8px;
        justify-content: space-between;
        font-size: 11px;
        color: #334155;
      }
      .menu-item:hover {
        background: #f1f5f9;
      }
      .menu-item.danger-item {
        color: #be123c;
      }
      .menu-item.danger-item:hover {
        background: #fff1f2;
      }
      .bot-avatar {
        width: 30px;
        height: 30px;
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
      }
      .bot-avatar.sm {
        width: 22px;
        height: 22px;
        font-size: 9px;
      }
      .bot-avatar.xl {
        width: 54px;
        height: 54px;
        font-size: 18px;
      }
      .shape-squircle {
        border-radius: 8px;
      }
      .bot-avatar.xl.shape-squircle {
        border-radius: 14px;
      }
      .shape-circle {
        border-radius: 999px;
      }
      .shape-diamond {
        border-radius: 5px;
        transform: rotate(45deg) scale(0.76);
      }
      .shape-diamond > span {
        transform: rotate(-45deg);
        display: inline-block;
      }
      .shape-hex {
        clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
      }
      .shape-triangle {
        clip-path: polygon(50% 4%, 98% 92%, 2% 92%);
      }
      .shape-triangle > span {
        margin-top: 7px;
      }
      /* Main Content & Right Settings Sidebar */
      .main {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #f8fafc;
      }
      .right-drawer {
        width: 356px;
        flex: none;
        border-left: 1px solid #e2e8f0;
        background: #fff;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .drawer-head {
        flex: none;
        padding: 10px 12px 8px;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .drawer-tabs {
        display: flex;
        gap: 3px;
        background: #f1f5f9;
        padding: 2px;
        border-radius: 6px;
        border: 1px solid #e2e8f0;
      }
      .drawer-tab {
        flex: 1;
        justify-content: center;
        border: 1px solid transparent;
        background: transparent;
        padding: 4px 5px;
        border-radius: 4px;
        font-size: 10px;
        color: #475569;
      }
      .drawer-tab.active {
        background: #fff;
        border-color: #cbd5e1;
        color: #0f172a;
        font-weight: 600;
      }
      .scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      /* Chat Tab (Single persistent desktop chat with bot, no New Chat) */
      .chat-stream {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg-wrap {
        max-width: 740px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 10px 12px;
        background: #fff;
      }
      .msg.user {
        background: #f1f5f9;
        border-color: #cbd5e1;
        align-self: flex-end;
        max-width: 82%;
      }
      .msg.bot {
        background: #fff;
        align-self: flex-start;
        width: 100%;
      }
      .msg-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
        font-size: 10px;
        color: #64748b;
      }
      .msg-head-left {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .steps-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 5px 8px;
        margin-bottom: 8px;
        border: 1px solid #e2e8f0;
        border-radius: 5px;
        background: #f8fafc;
        font-size: 10px;
        color: #475569;
      }
      .steps-detail {
        margin: -4px 0 8px;
        padding: 7px 9px;
        border: 1px solid #e2e8f0;
        border-top: 0;
        border-radius: 0 0 5px 5px;
        background: #fcfdff;
        font-size: 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .step-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .approval-card {
        margin-top: 8px;
        border: 1px solid #fcd34d;
        background: #fffbeb;
        border-radius: 6px;
        padding: 10px 12px;
      }
      .approval-card.resolved {
        border-color: #cbd5e1;
        background: #f8fafc;
      }
      .approval-args {
        margin: 6px 0 8px;
        padding: 6px 8px;
        background: #fff;
        border: 1px solid #fde68a;
        border-radius: 4px;
        font-size: 10px;
        white-space: pre-wrap;
        color: #334155;
      }
      .approval-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .composer-bar {
        flex: none;
        padding: 10px 20px 14px;
        background: #fff;
        border-top: 1px solid #e2e8f0;
      }
      .composer-inner {
        max-width: 740px;
        margin: 0 auto;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        padding: 8px 10px;
      }
      .composer-inner textarea {
        border: 0;
        padding: 0;
        resize: none;
        min-height: 36px;
        max-height: 84px;
        outline: none;
      }
      .composer-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid #f1f5f9;
      }
      .pill-row {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }
      /* Statistics, Sessions, Traces */
      .pane-pad {
        padding: 14px 18px;
      }
      .filter-bar {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 16px;
        background: #fff;
        border-bottom: 1px solid #e2e8f0;
      }
      .filter-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .segments {
        display: inline-flex;
      }
      .segments button {
        border-radius: 0;
        padding: 4px 8px;
        font-size: 10px;
        margin-left: -1px;
      }
      .segments button:first-child {
        border-radius: 5px 0 0 5px;
        margin-left: 0;
      }
      .segments button:last-child {
        border-radius: 0 5px 5px 0;
      }
      .segments button.active {
        background: #1e293b;
        color: #fff;
        border-color: #1e293b;
        z-index: 1;
      }
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }
      .kpi {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 10px 12px;
      }
      .kpi-label {
        font-size: 10px;
        color: #64748b;
        margin-bottom: 4px;
      }
      .kpi-val {
        font-size: 17px;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: -0.4px;
      }
      .kpi-sub {
        font-size: 9.5px;
        color: #64748b;
        margin-top: 3px;
      }
      .chart-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 11px 12px;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .bar-row {
        display: grid;
        grid-template-columns: 96px 1fr 82px;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 10.5px;
      }
      .bar-track {
        height: 8px;
        background: #f1f5f9;
        border-radius: 4px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 4px;
      }
      .split {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 330px minmax(0, 1fr);
        overflow: hidden;
      }
      .split.trace-split {
        grid-template-columns: 47% 53%;
      }
      .split-left {
        border-right: 1px solid #e2e8f0;
        background: #fff;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .split-right {
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .list-row {
        width: 100%;
        border: 0;
        border-bottom: 1px solid #f1f5f9;
        border-radius: 0;
        background: #fff;
        padding: 9px 12px;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-weight: 400;
      }
      .list-row:hover {
        background: #f8fafc;
      }
      .list-row.active {
        background: #f1f5f9;
        box-shadow: inset 3px 0 0 #1e293b;
      }
      .row-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        width: 100%;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }
      th {
        text-align: left;
        font-size: 10px;
        font-weight: 600;
        color: #64748b;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
        padding: 7px 10px;
        white-space: nowrap;
      }
      td {
        padding: 7px 10px;
        border-bottom: 1px solid #f1f5f9;
        font-size: 10.5px;
        vertical-align: middle;
      }
      tr.clickable {
        cursor: pointer;
      }
      tr.clickable:hover td {
        background: #f8fafc;
      }
      .wf-header {
        display: grid;
        grid-template-columns: 1fr 180px 54px;
        padding: 6px 10px;
        border-bottom: 1px solid #e2e8f0;
        background: #f8fafc;
        font-size: 9.5px;
        font-weight: 600;
        color: #64748b;
      }
      .wf-row {
        width: 100%;
        border: 0;

        grid-template-columns: repeat(5, minmax(0, 1fr));

      }
      .conn-tile {
        position: relative;
        aspect-ratio: 1 / 1;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 14px 10px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        text-align: center;
        transition:

        background: #f8fafc;
        justify-content: center;
        gap: 8px;

        right: 10px;
        width: 8px;
        height: 8px;
        border-radius: 999px;

        background: #10b981;

        background: #f59e0b;

      .tile-status-dot.off {
        background: #cbd5e1;

        padding: 4px 8px;
        font-size: 10px;

      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 9px;
      }

        font-size: 10px;
        font-weight: 600;
        color: #475569;

        padding: 6px 0;
        border-top: 1px solid #f1f5f9;

        height: 20px;
        border-radius: 999px;

        padding: 0;
      }
      .swatch.active {

        padding: 0;

        border-radius: 10px;
        background: #fff;
        justify-content: center;
      }
      .shape-pick.active {
        border-color: #0f172a;
        background: #f1f5f9;
      }
      .side-label {
        font-size: 9.5px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #64748b;
      }

      dialog {

        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 0;
        width: 420px;
        max-width: calc(100vw - 32px);

        justify-content: flex-end;

        padding: 10px 14px;

      function botLocation(bot) {
        if (bot.runtimeMode === 'remote') {
          const srv = REMOTE_SERVERS.find((s) => s.id === bot.remoteServer)
          return `${srv ? srv.url : 'https://bots.difflab.internal'}/${bot.slug}`

      function botAvatar(bot, size = '') {
        const initials = (bot.name || 'NB')
          .split(/\s+/)
          .filter(Boolean)
          .map((w) => w[0])
          .join('')
          .slice(0, 2)
          .toUpperCase()
        return `<span class="bot-avatar ${size} shape-${esc(bot.shape)}" style="background:${esc(bot.color)}" aria-hidden="true"><span>${esc(initials || 'NB')}</span></span>`
      }

      function botYamlPreview(bot) {
        const enabledConns = Object.entries(bot.connectorPerms)
          .filter(([, cfg]) => cfg.enabled)
          .map(([id, cfg]) => {
            const tools = Object.entries(cfg.tools)
              .map(([t, p]) => `      ${t}: ${p}`)
              .join('\n')
            return `  ${id}:\n    tools:\n${tools}`
          })
          .join('\n')
        const skillsYaml = bot.skills.length
          ? bot.skills
              .map((sk) => `  - ./skills/${sk.slug}/SKILL.md${sk.enabled ? '' : ' # disabled'}`)
              .join('\n')
          : '  []'
        const harnessBlock =
          bot.runtimeMode === 'remote'
            ? `harness:\n  mode: remote\n  server: ${bot.remoteServer}`
            : `harness:\n  mode: local`
        return `schema: diffagent.bot/v1
name: ${bot.name}
avatar:
  shape: ${bot.shape}
  color: "${bot.color}"
${harnessBlock}
runtime:
  model: ${bot.model}
  max_steps: ${bot.maxSteps}
  daily_budget_usd: ${bot.dailyBudgetUsd}
instructions: ./INSTRUCTIONS.md
skills:
${skillsYaml}
channels:
  slack:
    enabled: ${bot.channels.slack.enabled}
    targets: "${bot.channels.slack.targets}"
  discord:
    enabled: ${bot.channels.discord.enabled}
    targets: "${bot.channels.discord.targets}"
  web:
    enabled: ${bot.channels.web.enabled}
    origins: "${bot.channels.web.origins}"
connectors:
${enabledConns || '  {}'}`
      }

      function renderChatTab(bot) {
        const messages = bot.chatMessages
        const enabledConns = Object.entries(bot.connectorPerms)
          .filter(([, cfg]) => cfg.enabled)
          .map(([id]) => state.connectors.find((c) => c.id === id)?.name || id)
        const activeSkills = bot.skills.filter((s) => s.enabled).length

        const msgHtml =
          messages.length === 0
            ? `<div class="empty-wrap"><div class="empty-card">${botAvatar(bot, 'xl')}<h2 style="margin-top:10px">Chat with ${esc(bot.name)}</h2><p class="muted" style="margin-top:6px">Send a message to start working with ${esc(bot.name)}, or open Settings on the right to configure skills, connectors, and channels.</p></div></div>`
            : messages
                .map((m, idx) => {
                  if (m.role === 'user') {
                    return `<div class="msg user">
                      <div class="msg-head"><strong>${esc(m.author || 'Sam')}</strong><span>${esc(m.time)}</span></div>
                      <p>${esc(m.text)}</p>
                    </div>`
                  }
                  const approval = m.approval
                  return `<div class="msg bot">
                    <div class="msg-head">
                      <span class="msg-head-left">${botAvatar(bot, 'sm')}<strong>${esc(bot.name)}</strong><span class="badge">${esc(m.latency)}</span><span class="badge">${esc(m.tokens)}</span><span class="badge">${esc(m.cost)}</span></span>
                      <span>${esc(m.time)}</span>
                    </div>
                    ${
                      m.steps?.length
                        ? `<div class="steps-bar">
                            <button type="button" class="quiet" style="padding:1px 4px;font-size:10px" data-toggle-steps="${idx}">${m.stepsOpen ? '▾' : '▸'} ${m.steps.length} execution steps</button>

                          </div>
                          ${
                            m.stepsOpen
                              ? `<div class="steps-detail">${m.steps
                                  .map(
                                    (s) => `<div class="step-row">
                                      <span><span class="obs-type obs-${esc(s.type)}">${esc(s.type)}</span> <span class="mono">${esc(s.name)}</span> <span class="muted">· ${esc(s.summary)}</span></span>

                                  .join('')}</div>`
                              : ''
                          }`
                        : ''
                    }
                    <p style="white-space:pre-line">${esc(m.text)}</p>
                    ${
                      approval
                        ? `<div class="approval-card ${approval.status !== 'pending' ? 'resolved' : ''}">
                            <div class="row-between">
                              <strong>${approval.status === 'pending' ? 'Approval required' : approval.status === 'denied' ? 'Action denied' : 'Action approved'} · <span class="mono">${esc(approval.tool)}</span></strong>
                              <span class="badge ${approval.status === 'pending' ? 'amber' : approval.status === 'denied' ? 'red' : 'green'}">${esc(approval.connector)}</span>
                            </div>
                            <pre class="approval-args mono">${esc(approval.args)}</pre>
                            ${
                              approval.status === 'pending'
                                ? `<div class="approval-actions">

                                    <button type="button" data-approval="always-allow" data-msg-idx="${idx}">Always allow</button>

                                  </div>`

                            }
                          </div>`
                        : ''
                    }
                  </div>`
                })
                .join('')

        return `<div class="chat-stream"><div class="msg-wrap">${msgHtml}</div></div>
        <div class="composer-bar">
          <form id="chat-form" class="composer-inner">
            <textarea id="chat-input" name="message" aria-label="Message bot" placeholder="Message ${esc(bot.name)}… (Cmd/Ctrl + Enter to send)">${esc(state.draftMessage)}</textarea>
            <div class="composer-foot">

                <span class="badge">${esc(bot.model)}</span>

            </div>
          </form>
        </div>`
      }

          <div class="split trace-split">
            <div class="split-left">
              <div class="wf-header">
                <span>Observation</span>
                <span>${state.traceViewMode === 'waterfall' ? `Timeline (0ms → ${trace.latencyMs}ms)` : 'Type & Model'}</span>
                <span style="text-align:right">Duration</span>
              </div>
              <div class="scroll">
                ${trace.observations
                  .map((o) => {
                    const leftPct = (o.startMs / Math.max(trace.latencyMs, 1)) * 100
                    const widthPct = Math.max(3, (o.durMs / Math.max(trace.latencyMs, 1)) * 100)
                    return `<button type="button" class="wf-row ${obs && obs.id === o.id ? 'active' : ''}" data-select-obs="${esc(o.id)}">
                      <span style="padding-left:${o.depth * 14}px;display:flex;align-items:center;gap:5px;min-width:0">
                        <span class="obs-type obs-${esc(o.type)}">${esc(o.type)}</span>
                        <span class="mono" style="font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.name)}</span>
                      </span>
                      ${
                        state.traceViewMode === 'waterfall'
                          ? `<span class="wf-track"><span class="wf-bar" style="left:${leftPct.toFixed(1)}%;width:${Math.min(100 - leftPct, widthPct).toFixed(1)}%;background:${barColor[o.type] || '#475569'}"></span></span>`
                          : `<span class="muted mono" style="font-size:9.5px">${esc(o.model)}</span>`
                      }
                      <span class="mono muted" style="text-align:right;font-size:10px">${o.durMs}ms</span>
                    </button>`
                  })
                  .join('')}
              </div>
            </div>
            <div class="split-right">
              <div class="filter-bar">
                <div>
                  <span class="obs-type obs-${esc(obs.type)}">${esc(obs.type)}</span>
                  <strong class="mono" style="margin-left:5px">${esc(obs.name)}</strong>
                  <div class="muted" style="font-size:9.5px;margin-top:2px">${esc(obs.model)} · ${obs.durMs}ms${obs.tokens ? ` · ${obs.tokens.in} in / ${obs.tokens.out} out / ${obs.tokens.cached} cached · $${obs.cost.toFixed(4)}` : ''}</div>
                </div>
                <div class="segments" role="group" aria-label="Observation inspector tabs">
                  <button type="button" class="${state.obsTab === 'io' ? 'active' : ''}" data-obs-tab="io">Input / Output</button>
                  <button type="button" class="${state.obsTab === 'meta' ? 'active' : ''}" data-obs-tab="meta">Metadata</button>
                  <button type="button" class="${state.obsTab === 'json' ? 'active' : ''}" data-obs-tab="json">Raw JSON</button>
                </div>
              </div>
              <div class="scroll pane-pad">
                ${
                  state.obsTab === 'io'
                    ? `<div class="side-label" style="margin-bottom:4px">Input</div>
                       <pre class="payload-box mono">${esc(JSON.stringify(obs.input, null, 2))}</pre>
                       <div class="side-label" style="margin-bottom:4px">Output</div>
                       <pre class="payload-box mono">${esc(JSON.stringify(obs.output, null, 2))}</pre>`
                    : state.obsTab === 'meta'
                      ? `<div class="side-label" style="margin-bottom:4px">Observation metadata</div>
                         <pre class="payload-box mono">${esc(JSON.stringify(obs.meta, null, 2))}</pre>
                         <div class="side-label" style="margin-bottom:4px">Session &amp; tags</div>
                         <div class="pill-row"><span class="badge mono">${esc(trace.sessionId)}</span>${trace.tags.map((tg) => `<span class="badge">${esc(tg)}</span>`).join('')}</div>`
                      : `<pre class="payload-box mono">${esc(JSON.stringify(obs, null, 2))}</pre>`
                }
              </div>
            </div>
          </div>`
        }

        return `<div class="filter-bar">
          <div class="filter-group">
            <input id="trace-search" aria-label="Search traces" placeholder="Search trace ID, name, input, or tag…" value="${esc(state.traceSearch)}" style="width:240px;padding:4px 8px;font-size:10.5px" />
            <select id="trace-channel" aria-label="Filter traces by channel" style="padding:4px 8px;font-size:10px">
              ${['All', 'Desktop', 'Slack', 'Discord', 'Web']
                .map(
                  (c) =>
                    `<option value="${c}" ${state.traceChannel === c ? 'selected' : ''}>Channel: ${c}</option>`,
                )
                .join('')}
            </select>
            <select id="trace-status" aria-label="Filter traces by status" style="padding:4px 8px;font-size:10px">
              ${['All', 'OK', 'Awaiting approval', 'Error']
                .map(
                  (s) =>
                    `<option value="${s}" ${state.traceStatus === s ? 'selected' : ''}>Status: ${s}</option>`,
                )
                .join('')}
            </select>
          </div>
          <span class="muted" style="font-size:10px">${filtered.length} traces · click any row for waterfall</span>
        </div>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th>Trace</th>
                <th>Channel</th>
                <th>Session</th>
                <th>Input</th>
                <th>Latency</th>
                <th>Tokens</th>
                <th>Cost</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${filtered
                .map(
                  (t) => `<tr class="clickable" data-open-trace="${esc(t.id)}">
                    <td class="mono muted">${esc(t.time)}</td>
                    <td><strong>${esc(t.name)}</strong><div class="mono muted" style="font-size:9.5px">${esc(t.id)}</div></td>
                    <td><span class="badge ${t.channel === 'Slack' ? 'violet' : t.channel === 'Discord' ? 'blue' : ''}">${esc(t.channel)}</span></td>
                    <td class="mono muted" style="font-size:10px">${esc(t.sessionId)}</td>
                    <td style="max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.input)}</td>
                    <td class="mono">${(t.latencyMs / 1000).toFixed(2)}s</td>
                    <td class="mono">${t.tokens.toLocaleString()}</td>
                    <td class="mono">$${t.cost.toFixed(4)}</td>
                    <td><span class="badge ${t.status === 'Error' ? 'red' : t.status === 'Awaiting approval' ? 'amber' : 'green'}">${esc(t.status)}</span></td>
                  </tr>`,
                )
                .join('')}
            </tbody>
          </table>
        </div>`
      }

          return c.category === state.connectorFilter

        return `<div class="filter-bar">

            <div style="display:flex;justify-content:center;gap:8px">
              <button type="button" class="primary" data-action="open-new-bot">＋ New bot</button>
              <button type="button" data-action="open-user-connectors">Connectors</button>
            </div>
          </div>
        </div>`
      }

      function openNewBotDialog() {
        const d = state.newBotDraft
        const previewBot = { name: d.name || 'New Bot', shape: d.shape, color: d.color }
        showDialog(
          'New bot',
          `<form id="new-bot-form">
            <div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px">
              ${botAvatar(previewBot, 'xl')}
            </div>
            <label class="field">
              <span>Name</span>
              <input id="nb-name" name="botName" value="${esc(d.name)}" placeholder="e.g. Incident Helper" required />
            </label>
            <div class="field">
              <span>Avatar shape</span>
              <div class="pill-row" style="gap:8px">
                ${SHAPES.map(
                  (s) =>
                    `<button type="button" class="shape-pick ${d.shape === s ? 'active' : ''}" data-nb-shape="${s}" aria-label="Shape ${s}" title="${s}">${botAvatar({ name: d.name || 'NB', shape: s, color: d.color }, 'sm')}</button>`,
                ).join('')}
              </div>
            </div>
            <div class="field">
              <span>Color</span>
              <div class="pill-row" style="gap:8px">
                ${COLORS.map((c) => `<button type="button" class="swatch ${d.color === c ? 'active' : ''}" style="background:${c}" data-nb-color="${c}" aria-label="Color ${c}"></button>`).join('')}
              </div>
            </div>
            <div class="field" style="margin-bottom:0">
              <span>Harness</span>
              <div class="segments" role="group" aria-label="New bot harness">
                <button type="button" style="flex:1;justify-content:center" class="${d.runtimeMode === 'local' ? 'active' : ''}" data-nb-runtime="local">Local</button>
                <button type="button" style="flex:1;justify-content:center" class="${d.runtimeMode === 'remote' ? 'active' : ''}" data-nb-runtime="remote">Remote (prod-us)</button>
              </div>
            </div>
          </form>`,
          `<button type="button" data-action="close-dialog">Cancel</button>
           <button type="submit" form="new-bot-form" class="primary">Create bot</button>`,
        )
      }

      function openAddMcpDialog() {
        showDialog(
          'Add custom MCP server',
          `<form id="add-mcp-form">
            <p class="muted" style="margin-bottom:10px">Register a local stdio or remote Streamable HTTP MCP server. Enable its tools per bot in Settings.</p>
            <label class="field"><span>Connector name</span><input name="mcpName" value="PagerDuty MCP" required /></label>
            <label class="field"><span>Transport</span>
              <select name="transport">
                <option value="MCP · HTTP">Streamable HTTP / SSE</option>
                <option value="MCP · stdio">Local stdio command</option>
              </select>
            </label>
            <label class="field"><span>Server URL or command</span><input name="endpoint" class="mono" value="https://mcp.internal.local/pagerduty" required /></label>
            <label class="field" style="margin-bottom:0"><span>Credential reference (optional)</span><input name="secretRef" class="mono" value="env:PAGERDUTY_MCP_TOKEN" /></label>
          </form>`,
          `<button type="button" data-action="close-dialog">Cancel</button>
           <button type="submit" form="add-mcp-form" class="primary">Add MCP</button>`,
        )
      }

      function render() {
        const bot = currentBot()
        let mainHtml = ''

        if (state.view === 'empty') {
          mainHtml = renderEmptyState()
        } else if (state.view === 'user-connectors') {
          mainHtml = renderUserConnectors()
        } else if (state.view === 'user-settings') {
          mainHtml = renderUserSettings()
        } else {
          if (state.tab === 'chat') mainHtml = renderChatTab(bot)
          else if (state.tab === 'stats') mainHtml = renderStatsTab(bot)
          else if (state.tab === 'sessions') mainHtml = renderSessionsTab(bot)
          else mainHtml = renderTracesTab(bot)
        }

        const showDrawer = state.view === 'bot' && state.settingsOpen

        app.innerHTML = DOMPurify.sanitize(
          `<div class="shell">
            ${renderTopbar()}
            <div class="body-row">
              ${renderRail()}
              <main class="main">${mainHtml}</main>
              ${showDrawer ? renderBotSettingsDrawer(bot) : ''}
            </div>
          </div>`,
          {
            ADD_ATTR: [
              'data-action',
              'data-select-bot',
              'data-tab',
              'data-toggle-steps',
              'data-open-trace',
              'data-approval',
              'data-msg-idx',
              'data-stats-range',
              'data-select-session',
              'data-trace-view',
              'data-select-obs',
              'data-obs-tab',
              'data-bot-settings',
              'data-bot-runtime',
              'data-bot-shape',
              'data-bot-color',
              'data-bot-conn-toggle',
              'data-skill-toggle',
              'data-perm-conn',
              'data-perm-tool',
              'data-perm-val',
              'data-channel-toggle',
              'data-channel-field',
              'data-conn-filter',
              'data-toggle-conn',
              'aria-current',
              'aria-pressed',
              'aria-selected',
              'aria-haspopup',
              'aria-expanded',
              'aria-controls',
              'role',
              'viewBox',
              'stroke-width',
              'stroke-linecap',
              'stroke-linejoin',
            ],
            ADD_TAGS: ['svg', 'g', 'rect', 'line', 'polyline', 'text', 'path', 'circle', 'ellipse'],
          },
        )
        if (window.HSStaticMethods) window.HSStaticMethods.autoInit()
      }

      function applyHash() {
        closeDialog()
        state.accountMenuOpen = false
        state.settingsOpen = false
        const hash = (location.hash || '#chat').replace(/^#/, '')

        if (hash === 'empty') {
          state.view = 'empty'
          render()
          return
        }
        if (hash === 'user-connectors' || hash === 'add-mcp') {
          state.view = 'user-connectors'
          render()
          if (hash === 'add-mcp') openAddMcpDialog()
          return
        }
        if (hash === 'user-settings') {
          state.view = 'user-settings'
          render()
          return
        }
        if (hash === 'user-menu') {
          state.view = 'bot'
          state.selectedBot = 'support-triage'
          state.tab = 'chat'
          state.accountMenuOpen = true
          render()
          return
        }

        state.view = 'bot'
        if (hash === 'chat-remote') {
          state.selectedBot = 'pr-concierge'
          state.tab = 'chat'
          render()
          return
        }
        state.selectedBot = 'support-triage'
        if (hash === 'chat' || hash === 'chat-approval' || hash === 'new-bot') {
          state.tab = 'chat'
          const bot = currentBot()
          if (bot.chatMessages[1]) bot.chatMessages[1].stepsOpen = hash === 'chat'
          render()
          const stream = document.querySelector('.chat-stream')
          if (stream && hash === 'chat-approval') {
            stream.scrollTop = stream.scrollHeight
          }
          if (hash === 'new-bot') openNewBotDialog()
          return
        }
        if (hash === 'stats') {
          state.tab = 'stats'
          render()
          return
        }
        if (hash === 'sessions') {
          state.tab = 'sessions'
          state.selectedSessionId = 'sess_slk_91a2'
          render()
          return
        }
        if (hash === 'traces') {
          state.tab = 'traces'
          state.selectedTraceId = null
          render()
          return
        }
        if (hash === 'trace-detail') {
          state.tab = 'traces'
          state.selectedTraceId = 'tr_891a'
          state.selectedObsId = 'obs_4'
          state.traceViewMode = 'waterfall'
          state.obsTab = 'io'
          render()
          return
        }
        if (
          hash === 'bot-settings' ||
          hash === 'bot-skills' ||
          hash === 'bot-connectors' ||
          hash === 'bot-channels' ||
          hash === 'bot-files'
        ) {
          state.tab = 'chat'
          state.settingsOpen = true
          state.botSettingsSection = hash === 'bot-settings' ? 'general' : hash.replace('bot-', '')
          render()
          return
        }
        state.tab = 'chat'
        render()
      }

      window.addEventListener('hashchange', applyHash)

      document.addEventListener('click', (e) => {
        const el = e.target.closest(
          '[data-action],[data-select-bot],[data-tab],[data-toggle-steps],[data-open-trace],[data-approval],[data-stats-range],[data-select-session],[data-trace-view],[data-select-obs],[data-obs-tab],[data-bot-settings],[data-bot-runtime],[data-bot-shape],[data-bot-color],[data-perm-conn],[data-conn-filter],[data-toggle-conn],[data-nb-shape],[data-nb-color],[data-nb-runtime]',
        )
        if (!el) {
          if (state.accountMenuOpen && !e.target.closest('.account-menu')) {
            state.accountMenuOpen = false
            render()
          }
          return
        }

        if (el.dataset.nbShape) {
          state.newBotDraft.shape = el.dataset.nbShape
          openNewBotDialog()
          return
        }
        if (el.dataset.nbColor) {
          state.newBotDraft.color = el.dataset.nbColor
          openNewBotDialog()
          return
        }
        if (el.dataset.nbRuntime) {
          state.newBotDraft.runtimeMode = el.dataset.nbRuntime
          openNewBotDialog()
          return
        }

        if (el.dataset.selectBot) {
          state.view = 'bot'
          state.accountMenuOpen = false
          state.selectedBot = el.dataset.selectBot
          render()
          return
        }
        if (el.dataset.tab) {
          state.view = 'bot'
          state.accountMenuOpen = false
          state.tab = el.dataset.tab
          if (state.tab !== 'traces') state.selectedTraceId = null
          render()
          return
        }
        if (el.dataset.toggleSteps !== undefined) {
          const msg = currentBot().chatMessages[Number(el.dataset.toggleSteps)]
          if (msg) msg.stepsOpen = !msg.stepsOpen
          render()
          return
        }
        if (el.dataset.openTrace) {
          state.view = 'bot'
          state.tab = 'traces'
          state.selectedTraceId = el.dataset.openTrace
          const tr = TRACES.find((t) => t.id === state.selectedTraceId)
          state.selectedObsId = tr?.observations[0]?.id || null
          render()
          return
        }
        if (el.dataset.approval) {
          const bot = currentBot()
          const msg = bot.chatMessages[Number(el.dataset.msgIdx)]
          if (msg?.approval) {
            if (el.dataset.approval === 'allow-once') {
              msg.approval.status = 'once'
              notify('Allowed once · reply posted (prototype)')
            } else if (el.dataset.approval === 'always-allow') {
              msg.approval.status = 'always'
              if (bot.connectorPerms.slack) {
                bot.connectorPerms.slack.tools.post_message = 'allow'
              }
              notify('Updated slack.post_message policy to Allow')
            } else {
              msg.approval.status = 'denied'
              notify('Tool call denied and recorded in trace')
            }
          }
          render()
          return
        }
        if (el.dataset.statsRange) {
          state.statsRange = el.dataset.statsRange
          render()
          return
        }
        if (el.dataset.selectSession) {
          state.selectedSessionId = el.dataset.selectSession
          render()
          return
        }
        if (el.dataset.traceView) {
          state.traceViewMode = el.dataset.traceView
          render()
          return
        }
        if (el.dataset.selectObs) {
          state.selectedObsId = el.dataset.selectObs
          render()
          return
        }
        if (el.dataset.obsTab) {
          state.obsTab = el.dataset.obsTab
          render()
          return
        }
        if (el.dataset.botSettings) {
          state.botSettingsSection = el.dataset.botSettings
          render()
          return
        }
        if (el.dataset.botRuntime) {
          currentBot().runtimeMode = el.dataset.botRuntime
          render()
          return
        }
        if (el.dataset.botShape) {
          currentBot().shape = el.dataset.botShape
          render()
          return
        }
        if (el.dataset.botColor) {
          currentBot().color = el.dataset.botColor
          render()
          return
        }
        if (el.dataset.permConn) {
          const bot = currentBot()
          const c = bot.connectorPerms[el.dataset.permConn]
          if (c) c.tools[el.dataset.permTool] = el.dataset.permVal
          render()
          notify(`${el.dataset.permConn}.${el.dataset.permTool} → ${el.dataset.permVal}`)
          return
        }
        if (el.dataset.connFilter) {
          state.connectorFilter = el.dataset.connFilter
          render()
          return
        }
        if (el.dataset.toggleConn) {
          const c = state.connectors.find((x) => x.id === el.dataset.toggleConn)
          if (c) {
            c.status = c.status === 'Connected' ? 'Not connected' : 'Connected'
            notify(`${c.name}: ${c.status}`)
          }
          render()
          return
        }

        switch (el.dataset.action) {
          case 'toggle-bot-settings':
            state.settingsOpen = !state.settingsOpen
            render()
            break
          case 'toggle-account-menu':
            state.accountMenuOpen = !state.accountMenuOpen
            render()
            break
          case 'open-new-bot':
            state.accountMenuOpen = false
            openNewBotDialog()
            break
          case 'open-add-mcp':
            openAddMcpDialog()
            break
          case 'close-dialog':
            closeDialog()
            break
          case 'open-user-connectors':
            state.view = 'user-connectors'
            state.accountMenuOpen = false
            render()
            break
          case 'open-user-settings':
            state.view = 'user-settings'
            state.accountMenuOpen = false
            render()
            break
          case 'sign-out':
            state.accountMenuOpen = false
            render()
            notify('Signed out of remote servers (prototype)')
            break
          case 'go-traces':
            state.tab = 'traces'
            state.selectedTraceId = null
            render()
            break
          case 'back-to-traces':
            state.selectedTraceId = null
            render()
            break
          case 'add-skill': {
            const bot = currentBot()
            const n = bot.skills.length + 1
            bot.skills.push({
              slug: `custom-skill-${n}`,
              summary: 'Custom skill instructions loaded from bot directory.',
              enabled: true,
            })
            render()
            notify(`Added skills/custom-skill-${n}/SKILL.md`)
            break
          }
          case 'save-bot':
            notify(`Saved ${botLocation(currentBot())}/bot.yaml`)
            break
          case 'save-user-settings':
            notify('Saved ~/.diffagent/config.yaml')
            break
        }
      })

      document.addEventListener('input', (e) => {
        if (e.target.id === 'chat-input') state.draftMessage = e.target.value
        if (e.target.id === 'nb-name') state.newBotDraft.name = e.target.value
        if (e.target.id === 'session-search') {
          state.sessionSearch = e.target.value
          render()
          const input = document.getElementById('session-search')
          if (input) {
            input.focus()
            input.setSelectionRange(input.value.length, input.value.length)
          }
        }
        if (e.target.id === 'trace-search') {
          state.traceSearch = e.target.value
          render()
          const input = document.getElementById('trace-search')
          if (input) {
            input.focus()
            input.setSelectionRange(input.value.length, input.value.length)
          }
        }
        if (e.target.id === 'bot-name-input') currentBot().name = e.target.value
        if (e.target.id === 'bot-steps-input') currentBot().maxSteps = Number(e.target.value) || 6
        if (e.target.id === 'bot-budget-input')
          currentBot().dailyBudgetUsd = Number(e.target.value) || 10
        if (e.target.id === 'bot-instructions-input') currentBot().instructions = e.target.value
        if (e.target.dataset.channelField) {
          const [ch, field] = e.target.dataset.channelField.split('.')
          currentBot().channels[ch][field] = e.target.value
        }
      })

      document.addEventListener('change', (e) => {
        if (e.target.id === 'stats-channel') {
          state.statsChannel = e.target.value
          render()
        }
        if (e.target.id === 'session-channel') {
          state.sessionChannel = e.target.value
          render()
        }
        if (e.target.id === 'trace-channel') {
          state.traceChannel = e.target.value
          render()
        }
        if (e.target.id === 'trace-status') {
          state.traceStatus = e.target.value
          render()
        }
        if (e.target.id === 'bot-model-select') {
          currentBot().model = e.target.value
          render()
        }
        if (e.target.id === 'bot-server-select') {
          currentBot().remoteServer = e.target.value
          render()
        }
        if (e.target.dataset.skillToggle !== undefined) {
          const sk = currentBot().skills[Number(e.target.dataset.skillToggle)]
          if (sk) sk.enabled = e.target.checked
          render()
        }
        if (e.target.dataset.botConnToggle) {
          const id = e.target.dataset.botConnToggle
          const bot = currentBot()
          const c = state.connectors.find((x) => x.id === id)
          if (!bot.connectorPerms[id]) {
            bot.connectorPerms[id] = {
              enabled: true,
              tools: Object.fromEntries(c.tools.map((t) => [t.id, 'ask'])),
            }
          } else {
            bot.connectorPerms[id].enabled = e.target.checked
          }
          render()
        }
        if (e.target.dataset.channelToggle) {
          currentBot().channels[e.target.dataset.channelToggle].enabled = e.target.checked
          render()
        }
        if (e.target.id === 'user-retention') state.userSettings.retentionDays = e.target.value
        if (e.target.id === 'user-autoreload') state.userSettings.autoReload = e.target.checked
        if (e.target.id === 'user-theme') state.userSettings.theme = e.target.value
        if (e.target.id === 'user-policy') state.userSettings.defaultWritePolicy = e.target.value
      })

      document.addEventListener('submit', (e) => {
        e.preventDefault()
        if (e.target.id === 'chat-form') {
          const text = state.draftMessage.trim()
          if (!text) return
          const bot = currentBot()
          bot.chatMessages.push({
            role: 'user',
            author: 'Sam',
            time: 'now',
            text,
          })
          bot.chatMessages.push({
            role: 'bot',
            time: 'now',
            traceId: 'tr_891a',
            stepsOpen: false,
            latency: '0.94s',
            tokens: '1,180 tok',
            cost: '$0.0019',
            steps: [
              {
                type: 'gen',
                name: bot.model,
                ms: '940ms',
                summary: '880 in · 300 out',
              },
            ],
            text: `Simulated reply from ${bot.name}. Inspect the trace link above to explore token usage, latency, and tool spans.`,
          })
          state.draftMessage = ''
          render()
          const stream = document.querySelector('.chat-stream')
          if (stream) stream.scrollTop = stream.scrollHeight
        }
        if (e.target.id === 'new-bot-form') {
          const fd = new FormData(e.target)
          const name = String(fd.get('botName') || state.newBotDraft.name || 'New Bot').trim()
          const slug =
            name
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-|-$/g, '') || 'new-bot'
          const d = state.newBotDraft
          state.bots.push({
            slug,
            name,
            color: d.color,
            shape: d.shape,
            status: 'online',
            runtimeMode: d.runtimeMode,
            remoteServer: d.remoteServer,
            model: 'claude-sonnet-4-6',
            maxSteps: 8,
            dailyBudgetUsd: 10,
            instructions: `You are ${name}.`,
            skills: [],
            channels: {
              slack: { enabled: false, targets: '', trigger: '@mention', tokenRef: '' },
              discord: { enabled: false, targets: '', trigger: '/ask', tokenRef: '' },
              web: {
                enabled: false,
                endpoint:
                  d.runtimeMode === 'remote'
                    ? `https://bots.difflab.internal/v1/bots/${slug}/chat`
                    : `http://127.0.0.1:4170/v1/bots/${slug}/chat`,
                protocol: 'HTTP SSE + AG-UI',
                origins: '',
              },
            },
            connectorPerms: {},
            chatMessages: [],
            sessions: [],
          })
          state.view = 'bot'
          state.selectedBot = slug
          state.tab = 'chat'
          state.settingsOpen = false
          closeDialog()
          render()
          notify(
            `Created ${name} (${d.runtimeMode === 'remote' ? 'remote' : `~/.diffagent/bots/${slug}`})`,
          )
        }
        if (e.target.id === 'add-mcp-form') {
          const fd = new FormData(e.target)
          const name = String(fd.get('mcpName') || 'Custom MCP').trim()
          const id = name
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-|-$/g, '')
          state.connectors.push({
            id: id || 'custom-mcp',
            name,
            category: 'Custom MCP',
            kind: String(fd.get('transport') || 'MCP · HTTP'),
            status: 'Connected',
            account: String(fd.get('endpoint') || ''),
            secretRef: String(fd.get('secretRef') || 'none'),
            tools: [{ id: 'invoke', label: 'Invoke MCP tool' }],
          })
          closeDialog()
          render()
          notify(`Connected ${name}`)
        }
      })

      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && e.target.id === 'chat-input') {
          e.preventDefault()
          document.getElementById('chat-form')?.requestSubmit()
        }
      })

      applyHash()
    </script>
  </body>
</html>
