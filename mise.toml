# Run from repository root with `mise run <task>`.
# Build, test, and check never call the model provider.
# Chat and paid evaluations require DEEPSEEK_API_KEY in the environment.
# Generated-code tests require macOS sandbox-exec.
# Evaluations create fresh sets under benchmarks/results-next, never overwrite history.
# Install pinned tools with `mise install` before running tasks (especially sandboxed tasks).
# macOS /usr/bin/sandbox-exec and a DeepSeek API key are external requirements.

[tools]
rust = "1.98.1"
python = "3.12.13"
go = "1.25.14"

[tasks.preflight]
description = "Check runtime requirements without calling the model"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ "$(uname -s)" != Darwin || ! -x /usr/bin/sandbox-exec ]]; then
  echo 'The PoC requires macOS with /usr/bin/sandbox-exec for generated-code tasks.' >&2
  exit 1
fi
if ! /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true; then
  echo 'sandbox-exec is present but could not start a process.' >&2
  exit 1
fi
if [[ -z "${DEEPSEEK_API_KEY:-}" ]]; then
  echo 'Set DEEPSEEK_API_KEY in your environment before chat or evaluations.' >&2
  exit 1
fi
cargo fmt --version >/dev/null
cargo clippy --version >/dev/null
python3 --version
go version
echo 'PoC tools and environment are ready; API key validity was not checked.'
'''

[tasks."rig:chat"]
description = "Open Rig chat in the launch directory"
run = "bash scripts/chat.sh rig"

[tasks."ax:chat"]
description = "Open Ax chat in the launch directory"
run = "bash scripts/chat.sh ax"

[tasks."adk:chat"]
description = "Open ADK chat in the launch directory"
run = "bash scripts/chat.sh adk"

[tasks."rig:eval:tic-tac-toe"]
description = "Evaluate Rig flow on tic-tac-toe once (paid)"
confirm = "Run a paid Rig tic-tac-toe evaluation?"
run = "DIFFAGENT_RUN_SET=smoke-$(date +%Y%m%d-%H%M%S) bash scripts/benchmark-flow.sh 1 rig tic-tac-toe"

[tasks."rig:eval:csv-parser"]
description = "Evaluate Rig flow on CSV parsing once (paid)"
confirm = "Run a paid Rig CSV-parser evaluation?"
run = "DIFFAGENT_RUN_SET=smoke-$(date +%Y%m%d-%H%M%S) bash scripts/benchmark-flow.sh 1 rig csv-parser"

[tasks."ax:eval:tic-tac-toe"]
description = "Evaluate Ax flow on tic-tac-toe once (paid)"
confirm = "Run a paid Ax tic-tac-toe evaluation?"
run = "DIFFAGENT_RUN_SET=smoke-$(date +%Y%m%d-%H%M%S) bash scripts/benchmark-flow.sh 1 ax tic-tac-toe"

[tasks."ax:eval:csv-parser"]
description = "Evaluate Ax flow on CSV parsing once (paid)"
confirm = "Run a paid Ax CSV-parser evaluation?"
run = "DIFFAGENT_RUN_SET=smoke-$(date +%Y%m%d-%H%M%S) bash scripts/benchmark-flow.sh 1 ax csv-parser"

[tasks."adk:eval:tic-tac-toe"]
description = "Evaluate ADK flow on tic-tac-toe once (paid)"
confirm = "Run a paid ADK tic-tac-toe evaluation?"
run = "DIFFAGENT_RUN_SET=smoke-$(date +%Y%m%d-%H%M%S) bash scripts/benchmark-flow.sh 1 adk tic-tac-toe"

[tasks."adk:eval:csv-parser"]
description = "Evaluate ADK flow on CSV parsing once (paid)"
confirm = "Run a paid ADK CSV-parser evaluation?"
run = "DIFFAGENT_RUN_SET=smoke-$(date +%Y%m%d-%H%M%S) bash scripts/benchmark-flow.sh 1 adk csv-parser"

[tasks."all:eval"]
description = "Run 12 paid flow evaluations in a new result set"
confirm = "Run 12 paid flow evaluations (each capped at 240 seconds)?"
run = "DIFFAGENT_RUN_SET=parity-$(date +%Y%m%d-%H%M%S) bash scripts/benchmark-flow.sh 2"

[tasks.build]
description = "Build all SDK backends and shared crates without model calls"
run = "cargo build --workspace"

[tasks.test]
description = "Run Rust workspace and Go example tests without model calls"
run = "cargo test --workspace && go -C examples test ./..."

[tasks.check]
description = "Check Rust formatting, Rust and Go tests, and Clippy"
run = "cargo fmt --all -- --check && cargo test --workspace && go -C examples test ./... && cargo clippy --workspace -- -D warnings"
