[package]
name = "diffagent-ax"
version = "0.1.0"
edition = "2024"

[dependencies]
diffagent-core = { path = "../diffagent-core" }
diffagent-tui = { path = "../diffagent-tui" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
axllm = { version = "=25.0.0", features = ["runtime-quickjs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
