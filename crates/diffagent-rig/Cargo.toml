[package]
name = "diffagent-rig"
version = "0.1.0"
edition = "2024"

[dependencies]
diffagent-core = { path = "../diffagent-core" }
diffagent-tui = { path = "../diffagent-tui" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
rig = "=0.43.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"
